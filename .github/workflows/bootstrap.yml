name: Bootstrap
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat .godot-version)
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -O "$BASE/Godot_v${VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 -O "$BASE/Godot_v${VERSION}-stable_export_templates.tpz"
          sha512sum --check "$GITHUB_WORKSPACE/tools/godot-downloads.sha512"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp templates/linux_debug.x86_64 "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify editor import, startup, and exported build
        run: |
          python3 tools/qa.py doctor
          python3 tools/qa.py unit
          python3 tools/qa.py content
          python3 tools/qa.py integration
          python3 tools/qa.py physics
          python3 tools/qa.py smoke
          python3 tools/qa.py export
      - name: Native J01-J11 headless and rendered
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          python3 tools/qa.py e2e --journey J01
          xvfb-run -a python3 tools/qa.py e2e --journey J01 --rendered
          xvfb-run -a python3 tools/verify_diagnostics.py
          python3 tools/qa.py e2e --journey J02
          xvfb-run -a python3 tools/qa.py e2e --journey J02 --rendered
          python3 tools/qa.py e2e --journey J03
          xvfb-run -a python3 tools/qa.py e2e --journey J03 --rendered
          python3 tools/qa.py e2e --journey J04
          xvfb-run -a python3 tools/qa.py e2e --journey J04 --rendered
          python3 tools/qa.py e2e --journey J05
          xvfb-run -a python3 tools/qa.py e2e --journey J05 --rendered
          python3 tools/qa.py e2e --journey J06
          xvfb-run -a python3 tools/qa.py e2e --journey J06 --rendered
          python3 tools/qa.py e2e --journey J07
          xvfb-run -a python3 tools/qa.py e2e --journey J07 --rendered
          python3 tools/qa.py e2e --journey J09
          xvfb-run -a python3 tools/qa.py e2e --journey J09 --rendered
          python3 tools/qa.py e2e --journey J10
          xvfb-run -a python3 tools/qa.py e2e --journey J10 --rendered
          python3 tools/qa.py e2e --journey J03C02
          xvfb-run -a python3 tools/qa.py e2e --journey J03C02 --rendered
          python3 tools/qa.py e2e --journey J03C01
          xvfb-run -a python3 tools/qa.py e2e --journey J03C01 --rendered
          python3 tools/qa.py e2e --journey J03C03
          xvfb-run -a python3 tools/qa.py e2e --journey J03C03 --rendered
          python3 tools/qa.py e2e --journey J03C04
          xvfb-run -a python3 tools/qa.py e2e --journey J03C04 --rendered
          python3 tools/qa.py e2e --journey J03C05
          xvfb-run -a python3 tools/qa.py e2e --journey J03C05 --rendered
          python3 tools/qa.py e2e --journey J03C06
          xvfb-run -a python3 tools/qa.py e2e --journey J03C06 --rendered
          python3 tools/qa.py e2e --journey J03C07
          xvfb-run -a python3 tools/qa.py e2e --journey J03C07 --rendered
          python3 tools/qa.py e2e --journey J03C08
          xvfb-run -a python3 tools/qa.py e2e --journey J03C08 --rendered
          python3 tools/qa.py e2e --journey J11
          xvfb-run -a python3 tools/qa.py e2e --journey J11 --rendered
          python3 tools/qa.py e2e --journey J08
          python3 tools/qa.py e2e --journey J08A01
          xvfb-run -a python3 tools/qa.py e2e --journey J08A01 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_ball_art.gd
          python3 tools/qa.py e2e --journey J08A02
          xvfb-run -a python3 tools/qa.py e2e --journey J08A02 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_pin_art.gd
          python3 tools/qa.py e2e --journey J08A03
          xvfb-run -a python3 tools/qa.py e2e --journey J08A03 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A03
          python3 tools/qa.py e2e --journey J08A04
          xvfb-run -a python3 tools/qa.py e2e --journey J08A04 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A04
          python3 tools/qa.py e2e --journey J08A05
          xvfb-run -a python3 tools/qa.py e2e --journey J08A05 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A05
          python3 tools/qa.py e2e --journey J08A06
          xvfb-run -a python3 tools/qa.py e2e --journey J08A06 --rendered
          python3 tools/qa.py e2e --journey J08A06R
          xvfb-run -a python3 tools/qa.py e2e --journey J08A06R --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A06
          python3 tools/qa.py e2e --journey J08A07
          xvfb-run -a python3 tools/qa.py e2e --journey J08A07 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A07
          python3 tools/qa.py e2e --journey J12R01
          xvfb-run -a python3 tools/qa.py e2e --journey J12R01 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_rival_art.gd -- --rival=rival.surveyor
          python3 tools/qa.py e2e --journey J12R02
          xvfb-run -a python3 tools/qa.py e2e --journey J12R02 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_rival_art.gd -- --rival=rival.custodian
          python3 tools/qa.py e2e --journey J12V01
          xvfb-run -a python3 tools/qa.py e2e --journey J12V01 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V01
          python3 tools/qa.py e2e --journey J12V02
          xvfb-run -a python3 tools/qa.py e2e --journey J12V02 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V02
          python3 tools/qa.py e2e --journey J12V03
          xvfb-run -a python3 tools/qa.py e2e --journey J12V03 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V03
          python3 tools/qa.py e2e --journey J12V04
          xvfb-run -a python3 tools/qa.py e2e --journey J12V04 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V04
          python3 tools/qa.py e2e --journey J12V05
          xvfb-run -a python3 tools/qa.py e2e --journey J12V05 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V05
          python3 tools/qa.py e2e --journey J12V06
          xvfb-run -a python3 tools/qa.py e2e --journey J12V06 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V06
          python3 tools/qa.py e2e --journey J12V07
          xvfb-run -a python3 tools/qa.py e2e --journey J12V07 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_effect_art.gd -- --batch=E20-V07
          python3 tools/qa.py e2e --journey J12
          xvfb-run -a python3 tools/qa.py e2e --journey J12 --rendered
          python3 tools/qa.py experiment
          python3 tools/qa.py slice
      - name: Preserve Wave 1 art evidence after an earlier failure
        if: failure() && env.GODOT_BIN != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          python3 tools/qa.py e2e --journey J08A01
          xvfb-run -a python3 tools/qa.py e2e --journey J08A01 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_ball_art.gd
          python3 tools/qa.py e2e --journey J08A02
          xvfb-run -a python3 tools/qa.py e2e --journey J08A02 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_pin_art.gd
          python3 tools/qa.py e2e --journey J08A03
          xvfb-run -a python3 tools/qa.py e2e --journey J08A03 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A03
          python3 tools/qa.py e2e --journey J08A04
          xvfb-run -a python3 tools/qa.py e2e --journey J08A04 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A04
          python3 tools/qa.py e2e --journey J08A05
          xvfb-run -a python3 tools/qa.py e2e --journey J08A05 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A05
          python3 tools/qa.py e2e --journey J08A06
          xvfb-run -a python3 tools/qa.py e2e --journey J08A06 --rendered
          python3 tools/qa.py e2e --journey J08A06R
          xvfb-run -a python3 tools/qa.py e2e --journey J08A06R --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A06
          python3 tools/qa.py e2e --journey J08A07
          xvfb-run -a python3 tools/qa.py e2e --journey J08A07 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_item_art.gd -- --batch=E19-A07
      - name: Wave 2 Clubhouse and authored D01 art previews
        run: |
          python3 tools/qa.py e2e --journey J11ART
          xvfb-run -a python3 tools/qa.py e2e --journey J11ART --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_club_art.gd
          for batch in J19A08 J19A09 J19A10 J19A11 J19A12; do
            python3 tools/qa.py e2e --journey "$batch"
            xvfb-run -a python3 tools/qa.py e2e --journey "$batch" --rendered
          done
      - name: Wave 3 D02 Charm artwork
        run: |
          for batch in J19A13 J19A14 J19A15 J19A13N J19A14N; do
            python3 tools/qa.py e2e --journey "$batch"
            xvfb-run -a python3 tools/qa.py e2e --journey "$batch" --rendered
          done
      - name: Wave 4 Glass Pin identity
        run: |
          python3 tools/qa.py e2e --journey J19A16
          xvfb-run -a python3 tools/qa.py e2e --journey J19A16 --rendered
      - name: Wave 4 landed ability effects
        run: |
          for journey in J12V08 J12V08C; do
            python3 tools/qa.py e2e --journey "$journey"
            xvfb-run -a python3 tools/qa.py e2e --journey "$journey" --rendered
          done
      - name: Wave 5 AV-C03 first three items
        run: |
          for journey in JAVC03A JAVC03AC; do
            python3 tools/qa.py e2e --journey "$journey"
            xvfb-run -a python3 tools/qa.py e2e --journey "$journey" --rendered
          done
      - name: Wave 5 AV-C03 second three items
        run: |
          for journey in JAVC03B JAVC03BC; do
            python3 tools/qa.py e2e --journey "$journey"
            xvfb-run -a python3 tools/qa.py e2e --journey "$journey" --rendered
          done
      - name: Wave 6 modification art first three items
        run: |
          for journey in JAVC04A JAVC04AC; do
            python3 tools/qa.py e2e --journey "$journey"
            xvfb-run -a python3 tools/qa.py e2e --journey "$journey" --rendered
          done
      - name: Wave 6 modification art second three items
        run: |
          for journey in JAVC04B JAVC04BC; do
            python3 tools/qa.py e2e --journey "$journey"
            xvfb-run -a python3 tools/qa.py e2e --journey "$journey" --rendered
          done
      - name: C04 Echo Charge and Lantern art and effects
        run: |
          python3 tools/qa.py e2e --journey JAVC04C
          xvfb-run -a python3 tools/qa.py e2e --journey JAVC04C --rendered
          python3 tools/qa.py e2e --journey JAVC04CC
          xvfb-run -a python3 tools/qa.py e2e --journey JAVC04CC --rendered
      - name: House League theme asset inspector
        run: |
          python3 tools/qa.py e2e --journey J22L01ART
          xvfb-run -a python3 tools/qa.py e2e --journey J22L01ART --rendered
      - name: Preserve journey diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: |
            artifacts/e03/
            artifacts/e04/
            artifacts/e06/
            artifacts/e07/
            artifacts/e08/
            artifacts/e10/
            artifacts/e13/
            artifacts/e14/
            artifacts/e15/
            artifacts/e19-a01/
            artifacts/e19-a02/
            artifacts/e19-a03/
            artifacts/e19-a04/
            artifacts/e19-a05/
            artifacts/e19-a06/
            artifacts/e19-a07/
            artifacts/e21-r01/
            artifacts/e21-r02/
            artifacts/e20-v07/
            artifacts/e20-dense/
            artifacts/e20-v06/
            artifacts/e20-v05/
            artifacts/e20-v04/
            artifacts/e20-v03/
            artifacts/e20-v02/
            artifacts/e20-v01/
            artifacts/e16/
            artifacts/e18-c01/
            artifacts/e18-c02/
            artifacts/e18-c03/
            artifacts/e18-c04/
            artifacts/e18-c05/
            artifacts/e18-c06/
            artifacts/e18-c07/
            artifacts/e18-c08/
            artifacts/e16-art/
            artifacts/e19-a08/
            artifacts/e19-a09/
            artifacts/e19-a10/
            artifacts/e19-a11/
            artifacts/e19-a12/
            artifacts/e19-a13/
            artifacts/e19-a14/
            artifacts/e19-a15/
            artifacts/e19-a16/
            artifacts/e20-v08/
            artifacts/av-c03-a/
            artifacts/av-c03-b/
            artifacts/av-c04-a/
            artifacts/av-c04-b/
            artifacts/av-c04-c/
            artifacts/e22-l01-art/
          if-no-files-found: warn
