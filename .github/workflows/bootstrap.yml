name: Bootstrap
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat .godot-version)
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 -O "$BASE/Godot_v${VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 -O "$BASE/Godot_v${VERSION}-stable_export_templates.tpz"
          sha512sum --check "$GITHUB_WORKSPACE/tools/godot-downloads.sha512"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp templates/linux_debug.x86_64 "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify editor import, startup, and exported build
        run: |
          python3 tools/qa.py doctor
          python3 tools/qa.py unit
          python3 tools/qa.py content
          python3 tools/qa.py integration
          python3 tools/qa.py physics
          python3 tools/qa.py smoke
          python3 tools/qa.py export
      - name: Native J01-J11 headless and rendered
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          python3 tools/qa.py e2e --journey J01
          xvfb-run -a python3 tools/qa.py e2e --journey J01 --rendered
          xvfb-run -a python3 tools/verify_diagnostics.py
          python3 tools/qa.py e2e --journey J02
          xvfb-run -a python3 tools/qa.py e2e --journey J02 --rendered
          python3 tools/qa.py e2e --journey J03
          xvfb-run -a python3 tools/qa.py e2e --journey J03 --rendered
          python3 tools/qa.py e2e --journey J04
          xvfb-run -a python3 tools/qa.py e2e --journey J04 --rendered
          python3 tools/qa.py e2e --journey J05
          xvfb-run -a python3 tools/qa.py e2e --journey J05 --rendered
          python3 tools/qa.py e2e --journey J06
          xvfb-run -a python3 tools/qa.py e2e --journey J06 --rendered
          python3 tools/qa.py e2e --journey J07
          xvfb-run -a python3 tools/qa.py e2e --journey J07 --rendered
          python3 tools/qa.py e2e --journey J09
          xvfb-run -a python3 tools/qa.py e2e --journey J09 --rendered
          python3 tools/qa.py e2e --journey J10
          xvfb-run -a python3 tools/qa.py e2e --journey J10 --rendered
          python3 tools/qa.py e2e --journey J11
          xvfb-run -a python3 tools/qa.py e2e --journey J11 --rendered
          python3 tools/qa.py e2e --journey J08
          python3 tools/qa.py e2e --journey J08A01
          xvfb-run -a python3 tools/qa.py e2e --journey J08A01 --rendered
          xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . --script tools/capture_ball_art.gd
          python3 tools/qa.py experiment
          python3 tools/qa.py slice
      - name: Preserve journey diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: |
            artifacts/e03/
            artifacts/e04/
            artifacts/e06/
            artifacts/e07/
            artifacts/e08/
            artifacts/e10/
            artifacts/e13/
            artifacts/e14/
            artifacts/e15/
            artifacts/e19-a01/
            artifacts/e16/
          if-no-files-found: warn
